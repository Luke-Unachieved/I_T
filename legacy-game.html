classList.remove('show');}render();if(isAdvance&&lastAdvance?.pause)document.querySelector('.advance-feedback')?.scrollIntoView?.({block:'center',behavior:'smooth'});if(!isAdvance)toast(result.message);return result;}

function planTimeline(q,scale=q.days+q.payLagDays){
 const phases=[['备货',q.productionDays,'production'],['运送',Math.max(0,q.days-q.productionDays),'shipping'],['等款',q.payLagDays,'payment']];

}

function updateQuote(){const q=quoteOrder(state,quoteId,quoteOptions);if(!q.offer)return;const fc=forecastCash(state,q);document.querySelector('#quote-plans').innerHTML=planCards();document.querySelector('#terms-summary').innerHTML=paymentComparison(q,fc);document.querySelector('#route-composer').innerHTML=routeComposer(q);document.querySelector('#markup-label').textContent=(quoteOptions.markup>0?'+':'')+quoteOptions.markup+'%';document.querySelector('#quote-schedule').innerHTML=`<details><summary>本单分期收付明细</summary>${q.steps.map(s=>`<div class="money-row"><span>第 ${s.day} 天 · ${esc(s.label)}</span><b class="${s.amount>=0?'positive':'negative'}">${s.amount>=0?'+':''}${money(s.amount)}</b></div>`).join('')}</details>`;document.querySelector('#quote-result').innerHTML=`<div class="quote-decision"><div><small>这单预计赚</small><strong>${money(q.profit)}</strong></div><div><small>接单后42天现金底</small><strong class="${(fc.stressMinimum??fc.minimum)<0?'negative':''}">${money(fc.minimum)}</strong></div><div><small>交付 / 成交</small><strong>${q.days} 天 / ${q.chance}%</strong></div></div>${q.fx?.mode==='spot'?'<p class="hint">浮动尾款为估值，非保证到账。</p>':''}${profitComposition(q)}<details class="quote-accounting"><summary>查看成本、收款和资金曲线</summary><div class="quote-breakdown"><div class="money-row"><span>合同金额${q.fx?' · 美元':''}</span><b>${q.fx?usd(q.fx.usdCents):money(q.revenue)}</b></div><div class="money-row"><span>采购成本${q.fx?' · 人民币':''}</span><span>−${money(q.cost)}</span></div><div class="money-row"><span>运费</span><span>−${money(q.freight)}</span></div>${q.freightSaving?`<div class="money-row positive"><span>集货 / 专人货运已省</span><span>${money(q.freightSaving)}</span></div>`:''}${q.expansion?.branch?`<small class="hint">${esc(byId(MARKETS,q.offer.market).name)}子公司：成交率 +${q.expansion.chance} 个百分点${q.expansion.quality?' · 品质 +'+q.expansion.quality:''}（已计入）</small>`:''}${q.fx?fxQuote(q):''}${q.penalty?`<div class="money-row negative"><span>交期 / 品质赔付</span><span>−${money(q.penalty)}</span></div>`:''}<div class="money-row total"><span>${q.fx?.mode==='spot'?'订单利润估值':'预计订单利润'}</span><span class="${q.profit>=0?'positive':'negative'}">${money(q.profit)}</span></div><small class="hint">利润率 ${q.margin}% · 未分摊公司周运营费</small></div><div class="quote-stat"><div><strong>${q.chance}%</strong><small>预计成交率</small></div><div><strong>${q.days} 天</strong><small>${q.lateDays?'延误 '+q.lateDays+' 天':'按时交付'}</small></div><div><strong>${q.quality}</strong><small>交付品质</small></div></div>${chart(fc.points.map(p=>p.cash),fc.points.map(p=>dayLabel(p.day)),fc.estimated?'接单后现金估算':'接单后现金预测')}<div class="chart-caption"><span>未来42天最低现金</span><strong class="${(fc.stressMinimum??fc.minimum)<1500?'negative':'positive'}">${money(fc.minimum)}</strong></div>${fc.estimated?`<div class="hint fx-risk">按签约汇率估算，非保证到账。压力最低现金 ${money(fc.stressMinimum)}；尾款到账后才确定结汇损益。</div>`:''}</details>`;const reason=!q.valid?q.reason:(fc.stressMinimum??fc.minimum)<0?'汇率压力下资金不足，需调整方案或先回款':q.profit<0?'本单预计亏损，请确认是否值得为客户关系投入。':q.penalty?(q.offer.kind==='flagship'?'此方案不合格，不能完成最终目标；赔付已扣入利润。':'存在已知交期/品质赔付，已从利润扣除。'):q.fx?'采购价及合同美元金额固定，尾款按所选方式结汇。被拒不扣钱。':'签约后锁价，占用 1 个并行名额；被拒不扣钱。';document.querySelector('#quote-warning').textContent=reason+(q.valid?' 报价若被拒，本次询盘就结束；下周换新机会。':'');dialog.querySelector('[data-action="accept"]').disabled=!q.valid||(fc.stressMinimum??fc.minimum)<0;}
function paymentComparison(q,fc){const t=q.paymentTerms||{id:'standard',depositRate:q.offer.depositRate,payLagDays:q.payLagDays};const baseline=quoteOrder(state,quoteId,{...quoteOptions,paymentTerms:'standard'});const profitDiff=q.profit-baseline.profit,daysDiff=q.settlementDay-baseline.settlementDay;return `<div>订金 ${t.depositRate}% · ${t.payLagDays?'交付后 '+t.payLagDays+' 天收尾款':'交付即收尾款'}</div><small>${t.id==='standard'?'按原询盘付款条件':`比原条件${q.fx?.mode==='spot'?'预计':''}${profitDiff>=0?'多赚':'少赚'}${money(Math.abs(profitDiff))}，${daysDiff===0?'回款日不变':(daysDiff>0?'晚':'早')+Math.abs(daysDiff)+' 天收款'}`}${q.offer.kind==='flagship'?' · 框架试单条件固定':''}</small>`;}
