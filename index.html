h} / ${capacity(state)} 个并行名额</small></div>${state.active.map(o=>`<article class="order-card"><div class="row"><strong>${esc(o.offer.customer)} · ${esc(byId(PRODUCTS,o.offer.product).name)}</strong><span class="pill">${o.paidShipping?'运输中':'生产中'}</span></div><div class="progress"><i style="width:${Math.max(5,Math.min(100,(state.week-o.acceptedWeek)/(o.deliveryWeek-o.acceptedWeek)*100))}%"></i></div><p>第 ${o.deliveryWeek} 周交付 · 第 ${o.dueWeek} 周收齐款 · 预计利润 <b class="${o.profit>=0?'positive':'negative'}">${money(o.profit)}</b>${o.penalty?` · 已计赔付 ${money(o.penalty)}`:''}</p></article>`).join('')||'<div class="empty">还没有在途订单。选择询盘，比较成本、交期和最低现金后签约。</div>'}</section><section class="panel"><div class="panel-head"><h2>经营动态</h2><small>最新 5 条</small></div><ul class="compact-list">${state.log.slice(0,5).map(l=>`<li><small>第 ${l.week} 周</small>${esc(l.text)}</li>`).join('')||'<li>开张资金 ¥18,000 已就位。先拿下第一笔订单。</li>'}</ul></section></div><aside class="aside"><section class="panel"><div class="panel-head"><h2>未来 6 周资金</h2><span class="pill ${fc.minimum<1500?'warm':''}">${fc.minimum<1500?'周转偏紧':'可覆盖合同'}</span></div><div class="panel-body">${chart(fc.points.map(p=>p.cash),fc.points.map(p=>'第'+p.week+'周'),'未来6周现金')}<div class="chart-caption"><span>最低 ${money(fc.minimum)}</span><span>不含未来新单</span></div></div></section>${goals()}</aside></div>`;}
function market(){return `<div class="notice"><span>采购价每周变动，签约即锁定本单成本。报价时可调售价，但提价会降低成交率。</span>${button('去接单 →','tab','data-tab="desk"','small')}</div><section class="market-grid">${PRODUCTS.map(p=>{const points=state.priceHistory.map(h=>h[p.id]),last=points.at(-2)||p.base,now=state.prices[p.id],delta=Math.round((now/last-1)*100);return `<article class="panel market-card"><div class="goal-title"><h2 class="product-heading">${productArt(p.id)}${p.name}</h2><span class="pill ${delta>0?'warm':''}">${delta>=0?'+':''}${delta}%</span></div><div class="market-price">${money(now)}<small class="hint"> / ${p.unit}</small></div><div class="hint">上周 ${money(last)} · 长期基准 ${money(p.base)}</div>${chart(points,state.priceHistory.map(h=>'第'+h.week+'周'),p.name+'采购价',false)}<div class="chart-caption">近 ${points.length} 周采购走势</div><div class="hint">标准工厂采购价 · 集采和供应商影响最终成本</div></article>`;}).join('')}</section>`;}
function company(){return `<div class="grid"><div><section class="upgrade-grid">${UPGRADES.map(u=>`<article class="panel upgrade-card"><div class="goal-title"><h2>${u.name}</h2><span class="pill">${state.upgrades[u.id]} / ${u.max} 级</span></div><p>${esc(u.description)}</p><footer><strong>${state.upgrades[u.id]===u.max?'已满级':money(upgradeCost(state,u.id))}</strong>${button('安排升级','upgrade',`data-id="${u.id}" ${state.upgrades[u.id]===u.max?'disabled':''}`,'small')}</footer></article>`).join('')}</section><section class="panel"><div class="panel-head"><h2>复购客户</h2><small>履约留下的生意</small></div>${Object.values(state.customers).map(c=>`<div class="offer"><div><strong>${esc(c.name)}</strong><div class="sub">${esc(byId(MARKETS,c.market).name)} · 已交付 ${c.orders} 单</div></div><div class="number">${money(c.revenue)}<small>累计合同收入</small></div><span class="pill">复购提价 +${(Math.min(c.orders,6)*1.2).toFixed(1)}%</span></div>`).join('')||'<div class="empty">准时交付第一笔订单，积累自己的老客户。</div>'}</section></div><aside>${goals()}<section class="panel"><div class="panel-head"><h2>公司的底气</h2></div><div class="panel-body mini-kpis"><div><strong>${money(netWorth(state))}</strong><small>净值，含应收及在途已付成本</small></div><div><strong>${state.metrics.ontime}/${state.metrics.orders}</strong><small>准时交付</small></div><div><strong>${capacity(state)} 单</strong><small>并行容量</small></div></div></section></aside></div>`;}
function ledger(){const fc=forecastCash(state);return `<div class="grid"><div><section class="panel"><div class="panel-head"><h2>现金记录</h2><small>最近 ${state.history.length} 周</small></div><div class="panel-body">${chart(state.history.map(h=>h.cash),state.history.map(h=>'第'+h.week+'周'),'历史可用现金')}<div class="chart-caption"><span>现金不是利润。尾款未到账时，下一单仍需要周转。</span></div></div></section><section class="panel"><div class="panel-head"><h2>未来收支</h2><small>按已签合同预测</small></div><div class="scroll-table"><table class="ledger-table"><thead><tr><th>周次</th><th>入账</th><th>支出含运营</th><th>期末现金</th></tr></thead><tbody>${fc.points.map(p=>`<tr><td>第 ${p.week} 周${p.week===state.week?' · 当前':''}</td><td class="positive">${money(p.inflow)}</td><td>${money(p.outflow)}</td><td class="${p.cash<0?'negative':''}">${money(p.cash)}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><div class="panel-head"><h2>应收尾款</h2></div><ul class="compact-list">${state.receivables.map(r=>`<li><b>${esc(r.customer)}</b> · ${money(r.amount)}<br><small>第 ${r.dueWeek} 周到账 · 还需 ${r.dueWeek-state.week} 周</small></li>`).join('')||'<li>暂无已交付未回款的订单。</li>'}</ul></section><section class="panel"><div class="panel-head"><h2>流水</h2><small>最近 60 条</small></div><ul class="compact-list">${state.log.map(l=>`<li><small>第 ${l.week} 周</small>${esc(l.text)}</li>`).join('')||'<li>第一笔经营记录即将开始。</li>'}</ul></section></div><aside><section class="panel"><div class="panel-head"><h2>周转工具</h2></div><div class="panel-body"><div class="money-row"><span>当前借款</span><strong>${money(state.debt)}</strong></div><p class="hint">周息 0.8%，包含在每周运营支出。借款不会增加公司净值。</p><div class="save-tools">${button('周转借款','borrow',state.debt>=12000?'disabled':'','small')}${button('归还借款','repay',state.debt===0?'disabled':'','small')}</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>单证代办</h3><p class="hint">不需垫资，每周限一次。手头紧时先维持周转，再找合适订单。</p>${button(state.lastBrokerWeek===state.week?'本周已代办':'接一次代办','broker',state.lastBrokerWeek===state.week?'disabled':'','small')}</div></section><section class="panel"><div class="panel-head"><h2>存档</h2><span class="pill">${saveWarning?'保存异常':'自动保存'}</span></div><div class="panel-body"><div class="save-tools">${button('导出存档','export','','small')}${button('导入存档','import-open','','small')}${button('导出导入前备份','export-backup','','small')}</div><p class="hint">当前进度保存在此浏览器。换设备前先导出；新经营模式与原版故事存档分开保存。</p><a href="classic.html" class="hint">继续原版故事存档 ↗</a></div></section></aside></div>`;}
function render(){app.innerHTML=state?shell():start();}
function apply(action){const previous=state;const result=reduceTrade(state,action);if(result.changed){state=result.state;if(action.type==='NEXT_WEEK'){const orders=state.metrics.orders-previous.metrics.orders;lastReceipt=orders?{orders,profit:state.metrics.profit-previous.metrics.profit,cash:state.cash-previous.cash,markets:unlockedMarkets(state).length-unlockedMarkets(previous).length}:null;}save();}notice=result.message;render();toast(result.message);return result;}
function closeDialog(){importTicket++;if(dialog.open)dialog.close();quoteId=null;importCandidate=null;}
function openDialog(html){dialog.innerHTML=html;if(!dialog.open)dialog.showModal();}
function showQuote(id,reset=true){quoteId=id;if(reset)quoteOptions={supplier:'reliable',shipping:'sea',markup:0};const o=state.offers.find(x=>x.id===id);if(!o){closeDialog();return;}openDialog(`<div class="dialog-header"><div><div class="eyebrow">报价工作台 / ${esc(o.kindName)}</div><h2>${esc(byId(PRODUCTS,o.product).name)} · ${o.quantity}${esc(o.unit)}</h2><p>${esc(o.customer)} · 品质要求 ${o.quality} · 最晚 ${o.deadline} 周交付</p></div>${button('×','close','aria-label="关闭报价"')}</div><div class="dialog-body"><div class="quote-grid"><div><label class="field"><span>供应商</span><select id="quote-supplier">${SUPPLIERS.map(x=>`<option value="${x.id}" ${quoteOptions.supplier===x.id?'selected':''}>${x.name} · 基础品质${x.quality}</option>`).join('')}</select><small id="supplier-hint"></small></label><label class="field"><span>出运方式</span><select id="quote-shipping">${SHIPPING.map(x=>`<option value="${x.id}" ${quoteOptions.shipping===x.id?'selected':''}>${x.name} · ${x.weeks?x.weeks+'周':'当周送达'}</option>`).join('')}</select><small id="shipping-hint"></small></label><label class="field"><span>报价调整 <output id="markup-label">0%</output></span><input id="quote-markup" type="range" min="-10" max="15" step="1" value="${quoteOptions.markup}" aria-label="报价调整百分比"><small>基准单价 ${money(o.price)} / ${esc(o.unit)}。高报价利润多，客户更容易拒绝。</small></label><div id="quote-schedule"></div></div><div id="quote-result"></div></div></div><div class="dialog-footer"><span id="quote-warning" class="hint"></span>${button('提交报价 →','accept','','primary')}</div>`);updateQuote();}
function updateQuote(){const q=quoteOrder(state,quoteId,quoteOptions);if(!q.offer)return;const fc=forecastCash(state,q);document.querySelector('#supplier-hint').textContent=byId(SUPPLIERS,quoteOptions.supplier).description;document.querySelector('#shipping-hint').textContent=byId(SHIPPING,quoteOptions.shipping).description;document.querySelector('#markup-label').textContent=(quoteOptions.markup>0?'+':'')+quoteOptions.markup+'%';document.querySelector('#quote-schedule').innerHTML=`<details><summary>本单分期收付明细</summary>${q.steps.map(s=>`<div class="money-row"><span>第 ${s.week} 周 · ${esc(s.label)}</span><b class="${s.amount>=0?'positive':'negative'}">${s.amount>=0?'+':''}${money(s.amount)}</b></div>`).join('')}</details>`;document.querySelector('#quote-result').innerHTML=`<div class="quote-breakdown"><div class="money-row"><span>合同金额</span><b>${money(q.revenue)}</b></div><div class="money-row"><span>采购成本</span><span>−${money(q.cost)}</span></div><div class="money-row"><span>运费</span><span>−${money(q.freight)}</span></div>${q.penalty?`<div class="money-row negative"><span>交期 / 品质赔付</span><span>−${money(q.penalty)}</span></div>`:''}<div class="money-row total"><span>预计订单利润</span><span class="${q.profit>=0?'positive':'negative'}">${money(q.profit)}</span></div><small class="hint">利润率 ${q.margin}% · 未分摊公司周运营费</small></div><div class="quote-stat"><div><strong>${q.chance}%</strong><small>预计成交率</small></div><div><strong>${q.weeks} 周</strong><small>${q.late?'延误 '+q.late+' 周':'按时交付'}</small></div><div><strong>${q.quality}</strong><small>交付品质</small></div></div>${chart(fc.points.map(p=>p.cash),fc.points.map(p=>'第'+p.week+'周'),'接单后现金预测')}<div class="chart-caption"><span>接单后最低现金</span><strong class="${fc.minimum<1500?'negative':'positive'}">${money(fc.minimum)}</strong></div>`;const reason=!q.valid?q.reason:fc.minimum<0?'未来资金不足，需调整方案或先回款':q.profit<0?'本单预计亏损，请确认是否值得为客户关系投入。':q.penalty?(q.offer.kind==='flagship'?'此方案不合格，不能完成最终目标；赔付已扣入利润。':'存在已知交期/品质赔付，已从利润扣除。'):'签约后锁价，占用 1 个并行名额；被拒不扣钱。';document.querySelector('#quote-warning').textContent=reason;dialog.querySelector('[data-action="accept"]').disabled=!q.valid||fc.minimum<0;}
function confirmation(title,body,action,attrs=''){openDialog(`<div class="dialog-header"><h2>${esc(title)}</h2>${button('×','close','aria-label="关闭"')}</div><div class="dialog-body">${body}</div><div class="dialog-footer">${button('取消','close')}${button('确认','confirm-'+action,attrs,'primary')}</div>`);}
function importOpen(){openDialog(`<div class="dialog-header"><h2>导入经营存档</h2>${button('×','close','aria-label="关闭导入"')}</div><div class="dialog-body"><p class="hint">选择之前导出的经营存档文件。会先检查，不会立即覆盖当前进度。原版故事存档请在原版中导入。</p><input id="import-file" type="file" accept=".json,application/json" aria-label="选择存档文件"><div id="import-status" class="hint" role="status"></div></div>`);}
app.addEventListener('submit',e=>{if(e.target.id!=='start-form')return;e.preventDefault();if(damagedSave)return;state=createTradeGame(new FormData(e.target).get('company'));save();render();});
function handle(e){const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;
 if(a==='close'){closeDialog();return;}
 if(a==='receipt-dismiss'){lastReceipt=null;render();return;}
 if(a==='dismiss'){notice='';render();return;}
 if(a==='export-backup'){try{const raw=localStorage.getItem(KEY+':before-import');if(raw)download(raw,'贸易经营-导入前备份.json');else toast('尚无导入前备份，当前进度可正常导出。');}catch{toast('浏览器无法读取备份。');}return;}
 if(a==='export-damaged'){download(damagedSave,'经营存档-原文件备份.json');return;}
 if(a==='import-open'){importOpen();return;}
 if(a==='export'){download(JSON.stringify(state,null,2),`贸易经营-第${state.week}周.json`);toast('已生成存档文件，请保留下载文件。');return;}
 if(a==='tab'){tab=el.dataset.tab;render();window.scrollTo(0,0);return;}
 if(a==='quote'){showQuote(el.dataset.id);return;}
 if(a==='accept'){const id=quoteId,options={...quoteOptions};closeDialog();apply({type:'ACCEPT',offerId:id,...options});return;}
 if(a==='next'){apply({type:'NEXT_WEEK'});return;}
 if(a==='broker'){apply({type:'BROKER'});return;}
 if(a==='upgrade'){const id=el.dataset.id,u=byId(UPGRADES,id);confirmation(`升级${u.name}`,`<p>投入 <b>${money(upgradeCost(state,id))}</b>。</p><p class="hint">${esc(u.description)}。会检查已签合同的未来资金，资金不足时不会扣款。</p>`,'upgrade',`data-id="${id}"`);return;}
 if(a==='confirm-upgrade'){const id=el.dataset.id;closeDialog();apply({type:'UPGRADE',id});return;}
 if(a==='borrow'){confirmation('借一笔周转金',`<p>本次最多到账 <b>${money(Math.max(0,Math.min(6000,12000-state.debt)))}</b>，主动借款上限 ¥12,000。</p><p class="hint">每周利息 0.8%，会增加运营支出。这是游戏内资金，不涉及真实借贷。</p>`,'borrow');return;}
 if(a==='confirm-borrow'){closeDialog();apply({type:'BRIDGE'});return;}
 if(a==='repay'){confirmation('归还周转金',`<p>归还 <b>${money(Math.min(state.cash,state.debt))}</b>。若影响已签合同周转，不会执行。</p>`,'repay');return;}
 if(a==='confirm-repay'){closeDialog();apply({type:'REPAY',amount:Math.min(state.cash,state.debt)});return;}
 if(a==='confirm-import'&&importCandidate){const loaded=importCandidate;try{if(state)localStorage.setItem(KEY+':before-import',JSON.stringify(state));else if(damagedSave)localStorage.setItem(KEY+':before-import',damagedSave);}catch{toast('无法备份当前存档。请先导出，再尝试导入。');return;}closeDialog();damagedSave=null;state=loaded;tab='desk';save();notice='存档已导入，导入前进度已备份。';render();toast(notice);}
}
app.addEventListener('click',handle);dialog.addEventListener('click',handle);
dialog.addEventListener('cancel',()=>{quoteId=null;importCandidate=null;importTicket++;});
dialog.addEventListener('input',e=>{if(e.target.id==='quote-markup'){quoteOptions.markup=Number(e.target.value);updateQuote();}});
dialog.addEventListener('change',async e=>{if(e.target.id==='quote-supplier'||e.target.id==='quote-shipping'){quoteOptions[e.target.id==='quote-supplier'?'supplier':'shipping']=e.target.value;updateQuote();return;}if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;const ticket=++importTicket;try{if(file.size>1500000)throw new Error('存档文件过大');const loaded=parseTradeSave(await file.text());if(ticket!==importTicket||!dialog.open)return;importCandidate=loaded;confirmation('确认导入',`<p><b>${esc(loaded.name)}</b> · 第 ${loaded.week} 周 · 现金 ${money(loaded.cash)}</p><p class="hint">导入将替换当前经营进度，替换前会保留一份备份。原版故事存档不受影响。</p>`,'import');}catch(error){if(ticket===importTicket&&dialog.open)document.querySelector('#import-status').textContent=error.message==='存档文件过大'?'文件过大，请选择 1.5 MB 以内的经营存档。':'无法识别经营存档，当前进度未改动。原版故事存档请到原版入口导入。';}}});
render();

return {};})();
})();</script></body></html>
